appId: com.vortex.agent.desktop
productName: Vortex Agent Desktop
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: ../vortex-agent/backend
    to: backend
    filter:
      - '**/*'
win:
  target:
    - nsis
  artifactName: vortex-agent-desktop-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
