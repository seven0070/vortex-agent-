appId: com.vortexagent.desktop
productName: Vortex Agent
copyright: Copyright © 2024 Vortex Agent

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - dist-electron/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vortex Agent
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  license: ../LICENSE
  deleteAppDataOnUninstall: false

publish: null
