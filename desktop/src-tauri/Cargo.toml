[package]
name = "vortex_desktop"
version = "1.0.0"
description = "Vortex desktop shell"
authors = ["vortex"]
edition = "2021"

[lib]
name = "vortex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = [] }
